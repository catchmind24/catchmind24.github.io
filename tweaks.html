<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#09090B">
    <meta name="color-scheme" content="dark">
    <title>Tweaks · catchmind</title>
    <meta name="description" content="Every tweak in the catchmind repository, with what it does, compatibility and the latest changes.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Tweaks · catchmind">
    <meta property="og:description" content="Every tweak in the catchmind repository.">
    <meta property="og:url" content="https://catchmind24.github.io/tweaks.html">
    <meta property="og:image" content="https://catchmind24.github.io/assets/profile_nobg.png">
    <meta name="twitter:card" content="summary">
    <link rel="icon" type="image/png" href="assets/profile-80.png">
    <link rel="apple-touch-icon" href="assets/profile-180.png">
    <script>document.documentElement.classList.add('js')</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/site.css">
    <style>
        .back{
            display:inline-flex;
            align-items:center;
            gap:6px;
            margin:-8px 0 28px -8px;
            padding:8px;
            border-radius:8px;
            font-family:'IBM Plex Mono',monospace;
            font-size:.75rem;
            color:var(--text-quiet);
            text-decoration:none;
            transition:color .2s ease;
            -webkit-tap-highlight-color:transparent;
        }
        .back:hover,.back:active{color:var(--gold)}
        .back svg{width:14px;height:14px}

        /* what every tweak shares, said once instead of in every panel */
        .facts{
            margin-top:6px;
            font-family:'IBM Plex Mono',monospace;
            font-size:.75rem;
            color:var(--text-quiet);
            letter-spacing:.01em;
            text-wrap:balance;
        }
        .facts span{white-space:nowrap}

        /* ── Catalog ── */
        .tw{
            --row-pad:14px;
            position:relative;
            margin:0 calc(-1 * var(--row-pad));
            padding:0 var(--row-pad);
            border-radius:12px;
            scroll-margin-top:24px;
            transition:background .25s ease;
        }

        .tw+.tw::before{
            content:'';
            position:absolute;
            top:0;left:calc(var(--row-pad) + 54px);right:var(--row-pad);
            height:1px;
            background:var(--line);
            transition:opacity .2s ease;
        }

        /* an open tweak becomes one soft card, so its panel can't be mistaken for the next row */
        .tw[open]{background:var(--fill);margin-top:6px;margin-bottom:6px}
        .tw:not([open]):hover{background:var(--fill)}
        .tw[open]::before,.tw[open]+.tw::before,
        .tw:hover::before,.tw:hover+.tw::before{opacity:0}

        .tw-sum{
            display:block;
            list-style:none;
            cursor:pointer;
            -webkit-tap-highlight-color:transparent;
        }
        .tw-sum::-webkit-details-marker{display:none}
        .tw-sum::marker{content:''}

        .tw-head{
            display:flex;
            align-items:center;
            gap:14px;
            padding:11px 0;
        }

        .tw-ico{
            width:40px;height:40px;
            flex-shrink:0;
            border-radius:9px;
            background:var(--fill-2);
            box-shadow:0 0 0 .5px rgba(255,255,255,.1);
            object-fit:cover;
        }

        .tw-text{flex:1;min-width:0}

        .tw-line{
            display:flex;
            align-items:baseline;
            gap:8px;
        }

        .tw-title{
            font-size:.9rem;
            font-weight:500;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        .tw-ver{
            font-family:'IBM Plex Mono',monospace;
            font-size:.6875rem;
            color:var(--text-quiet);
            font-variant-numeric:tabular-nums;
        }

        .tw-tag{
            display:block;
            margin-top:1px;
            font-size:.78rem;
            line-height:1.35;
            color:var(--text-dim);
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        .tw .row-arr{transition:transform .3s var(--ease),color .25s ease,opacity .25s ease}
        .tw-sum:hover .row-arr{color:var(--gold);opacity:.8}
        .tw[open] .row-arr{transform:rotate(90deg);color:var(--gold);opacity:.8}

        /* expanded panel, aligned with the name column */
        .tw-panel{
            padding:0 0 18px 54px;
            font-size:.84rem;
            line-height:1.6;
            color:var(--text-soft);
        }
        .tw[open] .tw-panel{animation:unfold .3s var(--ease)}
        @keyframes unfold{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

        .tw-panel p+p,.tw-panel p+ul,.tw-panel ul+p{margin-top:8px}
        .tw-panel ul{padding-left:1.1em}
        .tw-panel li+li{margin-top:3px}
        .tw-panel li::marker{color:var(--gold-quiet)}
        .tw-panel strong{color:var(--text);font-weight:500}

        .tw-info{
            display:grid;
            grid-template-columns:auto 1fr;
            gap:4px 16px;
            margin-top:14px;
            font-size:.78rem;
        }
        .tw-info dt{
            font-family:'IBM Plex Mono',monospace;
            font-size:.6875rem;
            color:var(--text-quiet);
            padding-top:1px;
        }
        .tw-info dd{color:var(--text-soft)}

        .tw-new{margin-top:16px}
        .tw-new-h{
            font-family:'IBM Plex Mono',monospace;
            font-size:.6875rem;
            letter-spacing:.08em;
            text-transform:uppercase;
            color:var(--gold-quiet);
            margin-bottom:4px;
        }

        .tw-open{
            display:inline-flex;
            align-items:center;
            margin-top:16px;
            padding:6px 12px;
            border-radius:8px;
            box-shadow:inset 0 0 0 1px rgba(209,176,107,.28);
            color:var(--gold);
            font-size:.8rem;
            text-decoration:none;
            -webkit-tap-highlight-color:transparent;
        }
        .tw-open:active{background:var(--gold-08)}

        .note{
            font-family:'IBM Plex Mono',monospace;
            font-size:.75rem;
            color:var(--text-quiet);
        }

        @media(max-width:520px){
            .tw{--row-pad:10px}
        }
    </style>
</head>
<body>

    <div class="atm" aria-hidden="true"></div>

    <main class="ctn">

        <header class="header" data-reveal>
            <a class="back" href="./"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>catchmind</a>
            <h1 class="name">Tweaks</h1>
            <p class="tagline"><span id="count">All tweaks</span>. Tap one for details.</p>
            <p class="facts" id="facts" hidden></p>
        </header>

        <noscript><p class="note">This list needs JavaScript. The repository itself works without it.</p></noscript>

        <section class="section" data-reveal aria-labelledby="h-apps" id="secApps" hidden>
            <div class="section-head">
                <h2 class="section-label" id="h-apps">App tweaks</h2>
            </div>
            <div id="listApps"></div>
        </section>

        <section class="section" data-reveal aria-labelledby="h-util" id="secUtil" hidden>
            <div class="section-head">
                <h2 class="section-label" id="h-util">Utilities</h2>
            </div>
            <div id="listUtil"></div>
        </section>

        <!-- after the list, the way to get them -->
        <section class="section" data-reveal id="secInstall" hidden>
            <div class="rows rows-more">
                <a href="./" class="row">
                    <span class="row-ico"><svg class="row-glyph" viewBox="3.1 3.1 17.8 17.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
                    <span class="row-body">
                        <span class="row-title">Add the repository</span>
                    </span>
                    <svg class="row-arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
                </a>
            </div>
        </section>

        <p class="note" id="failed" hidden>Couldn't load the package list. Try again in a moment.</p>

        <footer class="footer" data-reveal>
            <p>© 2021–2026 <span>catchmind</span></p>
        </footer>

    </main>

    <script>
    (()=>{
        'use strict';

        const hasMotion = !matchMedia('(prefers-reduced-motion:reduce)').matches;
        const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent)
            || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const ARROW = '<svg class="row-arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
        const EAGER_ICONS = 8;   // roughly the first screen; the rest load as they scroll in

        const el = (tag, cls, text) => {
            const n = document.createElement(tag);
            if(cls) n.className = cls;
            if(text != null) n.textContent = text;
            return n;
        };

        /* ── Tiny Markdown: paragraphs, "- " lists, **bold**, `code`, two-space line breaks ── */
        const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const inline = s => esc(s)
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/`([^`]+)`/g, '<code>$1</code>');

        function markdown(src){
            let html = '', para = [], list = [];
            const flushP = () => { if(para.length){ html += '<p>' + para.join('') + '</p>'; para = [] } };
            const flushL = () => { if(list.length){ html += '<ul>' + list.map(i => '<li>' + i + '</li>').join('') + '</ul>'; list = [] } };
            String(src || '').replace(/\r/g, '').split('\n').forEach(line => {
                if(!line.trim()){ flushP(); flushL(); return }
                const m = line.match(/^\s*[-*]\s+(.*)$/);
                if(m){ flushP(); list.push(inline(m[1].trim())); return }
                flushL();
                const brk = / {2,}$/.test(line);
                para.push(inline(line.trim()) + (brk ? '<br>' : ' '));
            });
            flushP(); flushL();
            return html;
        }

        /* ── Packages index ── */
        function parsePackages(text){
            const latest = new Map();
            text.split(/\n\s*\n/).forEach(block => {
                const f = {};
                let key = null;
                block.split('\n').forEach(line => {
                    if(/^\s/.test(line) && key){ f[key] += '\n' + line.trim(); return }
                    const i = line.indexOf(':');
                    if(i < 1) return;
                    key = line.slice(0, i).toLowerCase();
                    f[key] = line.slice(i + 1).trim();
                });
                if(!f.package) return;
                const cur = latest.get(f.package);
                if(!cur || (f.version || '').localeCompare(cur.version || '', undefined, {numeric:true}) > 0) latest.set(f.package, f);
            });
            return [...latest.values()];
        }

        /* depiction links point at this site (or GitHub raw); read the local copy either way */
        async function loadDepiction(p){
            const name = String(p.sileodepiction || '').split('/depictions/')[1];
            if(!name) return null;
            try{
                const r = await fetch('depictions/' + name, {cache:'no-cache'});   // revalidate: a release changes them in place
                return r.ok ? await r.json() : null;
            }catch(_){ return null }
        }

        const views = (dep, tab) => (dep && dep.tabs && dep.tabs[tab] && dep.tabs[tab].views) || [];
        const infoRows = dep => views(dep, 0).filter(v => v.class === 'DepictionTableTextView' && v.title !== 'Developer');

        /* the value most tweaks share for each info row, e.g. Price -> Free */
        function sharedFacts(all){
            const tally = new Map();
            all.forEach(p => infoRows(p.dep).forEach(v => {
                if(!tally.has(v.title)) tally.set(v.title, new Map());
                const t = tally.get(v.title);
                t.set(v.text, (t.get(v.text) || 0) + 1);
            }));
            const shared = new Map();
            tally.forEach((counts, title) => {
                const [text, n] = [...counts].sort((a, b) => b[1] - a[1])[0];
                if(n * 2 > all.length) shared.set(title, text);
            });
            return shared;
        }

        const short = text => text.replace(/\s+or later$/i, '+');

        /* SOOP++ -> "soop", 말해보카++ -> "말해보카": the address to share for one tweak */
        const slug = p => (p.name || p.package).toLowerCase().replace(/\+/g, '').replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '');

        function fillPanel(panel, p, shared){
            const descView = views(p.dep, 0).find(v => v.class === 'DepictionMarkdownView');
            const desc = el('div', 'tw-desc');
            desc.innerHTML = markdown(descView ? descView.markdown : p.description);
            panel.append(desc);

            // only what differs from the facts in the page header
            const own = infoRows(p.dep).filter(v => shared.get(v.title) !== v.text);
            if(own.length){
                const dl = el('dl', 'tw-info');
                own.forEach(v => dl.append(el('dt', null, v.title), el('dd', null, v.text)));
                panel.append(dl);
            }

            const log = views(p.dep, 1);
            const li = log.findIndex(v => v.class === 'DepictionLabelView');
            const notes = li >= 0 && log.slice(li + 1).find(v => v.class === 'DepictionMarkdownView');
            if(notes){
                const box = el('div', 'tw-new');
                box.append(el('p', 'tw-new-h', 'New in ' + log[li].text));
                const body = el('div');
                body.innerHTML = markdown(notes.markdown);
                box.append(body);
                panel.append(box);
            }

            if(isIOS){
                const a = el('a', 'tw-open', 'Open in Sileo');
                a.href = 'sileo://package/' + encodeURIComponent(p.package);
                panel.append(a);
            }
        }

        function item(p, index, shared){
            const d = el('details', 'tw');
            d.id = slug(p);
            const sum = el('summary', 'tw-sum');
            const head = el('span', 'tw-head');

            const ico = el('img', 'tw-ico');
            ico.alt = '';
            ico.width = ico.height = 40;
            ico.loading = index < EAGER_ICONS ? 'eager' : 'lazy';
            ico.decoding = 'async';
            ico.referrerPolicy = 'no-referrer';
            if(/^https:\/\//.test(p.icon || '')) ico.src = p.icon;
            ico.addEventListener('error', () => ico.removeAttribute('src'));

            const text = el('span', 'tw-text');
            const line = el('span', 'tw-line');
            line.append(el('span', 'tw-title', p.name || p.package), el('span', 'tw-ver', p.version));
            text.append(line);
            const tag = (p.dep && p.dep.tagline) || '';
            if(tag) text.append(el('span', 'tw-tag', tag));

            head.append(ico, text);
            head.insertAdjacentHTML('beforeend', ARROW);
            sum.append(head);

            const panel = el('div', 'tw-panel');
            let filled = false;
            d.addEventListener('toggle', () => {
                if(d.open && !filled){ filled = true; fillPanel(panel, p, shared) }
                // keep the address bar on the open tweak so it can be copied and shared
                const here = decodeURIComponent(location.hash.slice(1));
                if(d.open) history.replaceState(null, '', '#' + d.id);
                else if(here === d.id) history.replaceState(null, '', location.pathname);
            });

            d.append(sum, panel);
            return d;
        }

        fetch('Packages', {cache:'no-cache'})
            .then(r => r.ok ? r.text() : Promise.reject(r.status))
            .then(async text => {
                const all = parsePackages(text)
                    .sort((a, b) => (a.name || a.package).localeCompare(b.name || b.package, 'en', {sensitivity:'base'}));
                if(!all.length) throw 0;
                await Promise.all(all.map(async p => { p.dep = await loadDepiction(p) }));

                document.getElementById('count').textContent = all.length + ' tweaks';
                const shared = sharedFacts(all);
                if(shared.size){
                    // Free · iOS 14.0+ · Rootful · Rootless · RootHide, breaking only between facts
                    const order = ['Price', 'Compatibility', 'Jailbreak'];
                    const titles = [...shared.keys()].sort((a, b) =>
                        ((order.indexOf(a) + 1) || 99) - ((order.indexOf(b) + 1) || 99));
                    const facts = document.getElementById('facts');
                    titles.forEach((t, i) => {
                        facts.append(el('span', null, short(shared.get(t)) + (i < titles.length - 1 ? ' ·' : '')));
                        if(i < titles.length - 1) facts.append(' ');
                    });
                    facts.hidden = false;
                }

                const groups = [
                    ['secApps', 'listApps', all.filter(p => (p.section || 'Tweaks') === 'Tweaks')],
                    ['secUtil', 'listUtil', all.filter(p => (p.section || 'Tweaks') !== 'Tweaks')],
                ];
                let index = 0;
                groups.forEach(([sec, list, ps]) => {
                    if(!ps.length) return;
                    const box = document.getElementById(list);
                    ps.forEach(p => box.append(item(p, index++, shared)));
                    document.getElementById(sec).hidden = false;
                });
                document.getElementById('secInstall').hidden = false;
                reveal();
                openFromHash();
            })
            .catch(() => {
                document.getElementById('failed').hidden = false;
                reveal();
            });

        /* ── tweaks.html#soop opens SOOP++ and brings it into view ── */
        function openFromHash(){
            const id = decodeURIComponent(location.hash.slice(1));
            const d = id && document.getElementById(id);
            if(!d || d.tagName !== 'DETAILS') return;
            d.open = true;
            d.closest('[data-reveal]')?.classList.add('shown');
            requestAnimationFrame(() => d.scrollIntoView({block:'start', behavior: hasMotion ? 'smooth' : 'auto'}));
        }
        window.addEventListener('hashchange', openFromHash);

        /* ── Reveal — staggered rise ── */
        function reveal(){
            const nodes = [...document.querySelectorAll('[data-reveal]')].filter(n => !n.hidden);
            if(!hasMotion || !('IntersectionObserver' in window)){
                nodes.forEach(n => n.classList.add('shown'));
                return;
            }
            const obs = new IntersectionObserver(entries => {
                entries.forEach(e => {
                    if(!e.isIntersecting) return;
                    setTimeout(() => e.target.classList.add('shown'), 80 + nodes.indexOf(e.target) * 100);
                    obs.unobserve(e.target);
                });
            }, {threshold:.05});
            nodes.forEach(n => obs.observe(n));
        }
    })();
    </script>
</body>
</html>
